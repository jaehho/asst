[workspace]
resolver = "3"
members = ["crates/asst-core", "crates/asstd", "crates/asst", "crates/asst-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Jaeho Cho <jaeho2025@gmail.com>"]
repository = "https://github.com/jaehho/asst"

[workspace.dependencies]
asst-core = { path = "crates/asst-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
